<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="jenny-title jenny-desc">
  <title id="jenny-title">Spinning jenny</title>
  <desc id="jenny-desc">A stylised spinning jenny with multiple spindles and a large drive wheel</desc>
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" result="noise" seed="14"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#1a1008" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow-sm">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1a1008" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Large drive wheel -->
  <g filter="url(#shadow)" transform="translate(710, 245)">
    <!-- Outer rim - double ring for depth -->
    <circle cx="0" cy="0" r="155" fill="none" stroke="#4a3420" stroke-width="8" filter="url(#paper)"/>
    <circle cx="0" cy="0" r="148" fill="none" stroke="#6a5440" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="161" fill="none" stroke="#3a2818" stroke-width="1.5" opacity="0.25"/>

    <!-- Hub - layered for depth -->
    <circle cx="0" cy="0" r="22" fill="#5a4430" stroke="#3a2818" stroke-width="3" filter="url(#paper)"/>
    <circle cx="0" cy="0" r="15" fill="#6a5440" stroke="#5a4430" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#3a2818" stroke="#2a1808" stroke-width="1.5"/>

    <!-- Spokes - tapered look with varying thickness -->
    <line x1="0" y1="-22" x2="0" y2="-148" stroke="#4a3420" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="0" y2="148" stroke="#4a3420" stroke-width="5" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="-148" y2="0" stroke="#4a3420" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="148" y2="0" stroke="#4a3420" stroke-width="5" stroke-linecap="round"/>
    <line x1="15" y1="-15" x2="105" y2="-105" stroke="#4a3420" stroke-width="4" stroke-linecap="round"/>
    <line x1="-15" y1="15" x2="-105" y2="105" stroke="#4a3420" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="15" x2="105" y2="105" stroke="#4a3420" stroke-width="4" stroke-linecap="round"/>
    <line x1="-15" y1="-15" x2="-105" y2="-105" stroke="#4a3420" stroke-width="4" stroke-linecap="round"/>

    <!-- Spoke highlights -->
    <line x1="2" y1="-25" x2="2" y2="-145" stroke="#6a5440" stroke-width="1" opacity="0.2"/>
    <line x1="2" y1="25" x2="2" y2="145" stroke="#6a5440" stroke-width="1" opacity="0.2"/>

    <!-- Handle - more prominent -->
    <line x1="105" y1="105" x2="115" y2="120" stroke="#4a3420" stroke-width="4" stroke-linecap="round"/>
    <circle cx="118" cy="125" r="12" fill="#6a5440" stroke="#4a3420" stroke-width="2.5" filter="url(#paper)"/>
    <circle cx="118" cy="125" r="5" fill="#5a4430" stroke="#4a3420" stroke-width="1"/>
  </g>

  <!-- Frame -->
  <g filter="url(#shadow)">
    <!-- Top beam - with wood grain -->
    <rect x="55" y="160" width="590" height="16" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2.5" filter="url(#paper)"/>
    <line x1="60" y1="166" x2="640" y2="166" stroke="#6a5440" stroke-width="0.8" opacity="0.2"/>
    <line x1="60" y1="170" x2="640" y2="170" stroke="#6a5440" stroke-width="0.5" opacity="0.15"/>

    <!-- Bottom beam -->
    <rect x="55" y="410" width="590" height="16" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2.5" filter="url(#paper)"/>
    <line x1="60" y1="416" x2="640" y2="416" stroke="#6a5440" stroke-width="0.8" opacity="0.2"/>

    <!-- Left post -->
    <rect x="55" y="155" width="16" height="278" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2.5" filter="url(#paper)"/>
    <line x1="61" y1="160" x2="61" y2="428" stroke="#6a5440" stroke-width="0.8" opacity="0.2"/>

    <!-- Right post -->
    <rect x="630" y="155" width="16" height="278" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2.5" filter="url(#paper)"/>

    <!-- Legs - splayed -->
    <rect x="40" y="422" width="14" height="55" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2" filter="url(#paper)" transform="rotate(-6, 47, 422)"/>
    <rect x="68" y="422" width="14" height="55" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2" filter="url(#paper)" transform="rotate(6, 75, 422)"/>
    <rect x="620" y="422" width="14" height="55" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2" filter="url(#paper)" transform="rotate(-6, 627, 422)"/>
    <rect x="648" y="422" width="14" height="55" rx="3" fill="#5a4430" stroke="#3a2818" stroke-width="2" filter="url(#paper)" transform="rotate(6, 655, 422)"/>
  </g>

  <!-- Spindle rail -->
  <g filter="url(#shadow-sm)">
    <rect x="80" y="200" width="555" height="10" rx="3" fill="#6a5440" stroke="#4a3420" stroke-width="2" filter="url(#paper)"/>
    <line x1="85" y1="204" x2="630" y2="204" stroke="#7a6450" stroke-width="0.8" opacity="0.25"/>
  </g>

  <!-- Spindles with varying thread amounts -->
  <g filter="url(#shadow-sm)">
    <!-- Spindle 1 - full bobbin -->
    <g transform="translate(125, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-9" y="18" width="18" height="40" rx="3" fill="#c87830" opacity="0.35"/>
      <path d="M -8 22 Q 0 20 8 22 M -8 28 Q 0 26 8 28 M -8 34 Q 0 32 8 34 M -8 40 Q 0 38 8 40 M -8 46 Q 0 44 8 46 M -8 52 Q 0 50 8 52" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.5"/>
    </g>

    <!-- Spindle 2 - partial -->
    <g transform="translate(190, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-8" y="28" width="16" height="30" rx="3" fill="#c87830" opacity="0.25"/>
      <path d="M -7 32 Q 0 30 7 32 M -7 38 Q 0 36 7 38 M -7 44 Q 0 42 7 44 M -7 50 Q 0 48 7 50" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.45"/>
    </g>

    <!-- Spindle 3 - mostly full -->
    <g transform="translate(255, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-9" y="16" width="18" height="42" rx="3" fill="#c87830" opacity="0.4"/>
      <path d="M -8 20 Q 0 18 8 20 M -8 26 Q 0 24 8 26 M -8 32 Q 0 30 8 32 M -8 38 Q 0 36 8 38 M -8 44 Q 0 42 8 44 M -8 50 Q 0 48 8 50" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.55"/>
    </g>

    <!-- Spindle 4 - nearly empty -->
    <g transform="translate(320, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-6" y="40" width="12" height="18" rx="3" fill="#c87830" opacity="0.2"/>
      <path d="M -5 44 Q 0 42 5 44 M -5 50 Q 0 48 5 50" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.4"/>
    </g>

    <!-- Spindle 5 - half full -->
    <g transform="translate(385, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-8" y="24" width="16" height="34" rx="3" fill="#c87830" opacity="0.3"/>
      <path d="M -7 28 Q 0 26 7 28 M -7 34 Q 0 32 7 34 M -7 40 Q 0 38 7 40 M -7 46 Q 0 44 7 46 M -7 52 Q 0 50 7 52" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.45"/>
    </g>

    <!-- Spindle 6 - full -->
    <g transform="translate(450, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-9" y="16" width="18" height="44" rx="3" fill="#c87830" opacity="0.38"/>
      <path d="M -8 20 Q 0 18 8 20 M -8 26 Q 0 24 8 26 M -8 32 Q 0 30 8 32 M -8 38 Q 0 36 8 38 M -8 44 Q 0 42 8 44 M -8 50 Q 0 48 8 50 M -8 56 Q 0 54 8 56" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.5"/>
    </g>

    <!-- Spindle 7 - partial -->
    <g transform="translate(515, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="32" width="14" height="26" rx="3" fill="#c87830" opacity="0.22"/>
      <path d="M -6 36 Q 0 34 6 36 M -6 42 Q 0 40 6 42 M -6 48 Q 0 46 6 48" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.4"/>
    </g>

    <!-- Spindle 8 - mostly full -->
    <g transform="translate(580, 212)">
      <rect x="-4" y="0" width="8" height="85" rx="2" fill="#a89060" stroke="#7a6040" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-7" y="78" width="14" height="12" rx="2" fill="#7a6040" stroke="#5a4020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-10" y="14" width="20" height="48" rx="4" fill="#d8c8a0" stroke="#b8a878" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="-9" y="18" width="18" height="40" rx="3" fill="#c87830" opacity="0.32"/>
      <path d="M -8 22 Q 0 20 8 22 M -8 28 Q 0 26 8 28 M -8 34 Q 0 32 8 34 M -8 40 Q 0 38 8 40 M -8 46 Q 0 44 8 46 M -8 52 Q 0 50 8 52" fill="none" stroke="#c87830" stroke-width="0.6" opacity="0.48"/>
    </g>
  </g>

  <!-- Thread lines from spindles to wheel - with slight curves -->
  <g opacity="0.3">
    <path d="M 125 212 Q 350 190 555 245" fill="none" stroke="#c87830" stroke-width="1"/>
    <path d="M 190 212 Q 370 192 555 243" fill="none" stroke="#c87830" stroke-width="0.8"/>
    <path d="M 255 212 Q 390 195 555 242" fill="none" stroke="#c87830" stroke-width="1"/>
    <path d="M 320 212 Q 420 200 555 243" fill="none" stroke="#c87830" stroke-width="0.8"/>
    <path d="M 385 212 Q 450 205 555 244" fill="none" stroke="#c87830" stroke-width="1"/>
    <path d="M 450 212 Q 490 210 555 245" fill="none" stroke="#c87830" stroke-width="0.8"/>
    <path d="M 515 212 Q 530 215 555 244" fill="none" stroke="#c87830" stroke-width="1"/>
    <path d="M 580 212 Q 560 220 555 243" fill="none" stroke="#c87830" stroke-width="0.8"/>
  </g>

</svg>
