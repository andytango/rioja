<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-label="Supervisor mode flow diagram">
  <title>Supervisor mode: Explain, Break down, Plan, Execute, Review, Test cycle</title>
  <defs>
    <style>
      text { font-family: 'Berkeley Mono', monospace; fill: currentColor; }
      .box-text  { font-size: 14px; font-weight: 500; }
      .box-sub   { font-size: 11px; font-style: italic; }
      .human-box { stroke: rgb(217, 119, 6);  fill: rgba(217, 119, 6,  0.08); }
      .ai-box    { stroke: rgb(59, 130, 246); fill: rgba(59, 130, 246, 0.08); }
      .mixed-box { stroke: rgb(34, 197, 94);  fill: rgba(34, 197, 94,  0.08); }
      .arrow     { fill: none; stroke: currentColor; stroke-width: 2; marker-end: url(#arrowhead); }
      .back-arrow{ fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 5,3; marker-end: url(#arrowhead); opacity: 0.7; }
      .human-icon{ stroke: rgb(217, 119, 6); fill: none; }
      .ai-icon   { stroke: rgb(59, 130, 246); fill: none; }
      .mixed-icon{ stroke: rgb(34, 197, 94); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Row 1, Col 1: Explain / Research (mixed) -->
  <rect class="mixed-box" x="20" y="50" width="180" height="70" rx="6"/>
  <text x="110" y="79" text-anchor="middle" class="box-text">Explain /</text>
  <text x="110" y="96" text-anchor="middle" class="box-text">Research</text>
  <g class="mixed-icon" transform="translate(186, 62)">
    <circle cx="-4" cy="-4" r="3" stroke-width="1.5"/>
    <rect x="1" y="-7" width="7" height="7" rx="1.5" fill="none" stroke-width="1.5"/>
  </g>

  <!-- Row 1, Col 2: Break down tasks (human) -->
  <rect class="human-box" x="305" y="50" width="180" height="70" rx="6"/>
  <text x="395" y="79" text-anchor="middle" class="box-text">Break down</text>
  <text x="395" y="96" text-anchor="middle" class="box-text">tasks</text>
  <g class="human-icon" transform="translate(471, 62)">
    <circle cx="0" cy="-5" r="3.5" stroke-width="1.5"/>
    <path d="M -6 5 Q 0 0 6 5" fill="none" stroke-width="1.5"/>
  </g>

  <!-- Row 1, Col 3: Plan (mixed) -->
  <rect class="mixed-box" x="590" y="50" width="180" height="70" rx="6"/>
  <text x="680" y="82" text-anchor="middle" class="box-text">Plan</text>
  <g class="mixed-icon" transform="translate(756, 62)">
    <circle cx="-4" cy="-4" r="3" stroke-width="1.5"/>
    <rect x="1" y="-7" width="7" height="7" rx="1.5" fill="none" stroke-width="1.5"/>
  </g>

  <!-- Row 2, Col 1: Test (AI) -->
  <rect class="ai-box" x="20" y="190" width="180" height="70" rx="6"/>
  <text x="110" y="222" text-anchor="middle" class="box-text">Test</text>
  <g class="ai-icon" transform="translate(186, 202)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke-width="1.5"/>
    <line x1="-5" y1="-2" x2="-8" y2="-2" stroke-width="1.5"/>
    <line x1="-5" y1="2"  x2="-8" y2="2"  stroke-width="1.5"/>
    <line x1="5"  y1="-2" x2="8"  y2="-2" stroke-width="1.5"/>
    <line x1="5"  y1="2"  x2="8"  y2="2"  stroke-width="1.5"/>
  </g>

  <!-- Row 2, Col 2: Review (human) -->
  <rect class="human-box" x="305" y="190" width="180" height="70" rx="6"/>
  <text x="395" y="222" text-anchor="middle" class="box-text">Review</text>
  <g class="human-icon" transform="translate(471, 202)">
    <circle cx="0" cy="-5" r="3.5" stroke-width="1.5"/>
    <path d="M -6 5 Q 0 0 6 5" fill="none" stroke-width="1.5"/>
  </g>

  <!-- Row 2, Col 3: Execute (AI) -->
  <rect class="ai-box" x="590" y="190" width="180" height="70" rx="6"/>
  <text x="680" y="222" text-anchor="middle" class="box-text">Execute</text>
  <g class="ai-icon" transform="translate(756, 202)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke-width="1.5"/>
    <line x1="-5" y1="-2" x2="-8" y2="-2" stroke-width="1.5"/>
    <line x1="-5" y1="2"  x2="-8" y2="2"  stroke-width="1.5"/>
    <line x1="5"  y1="-2" x2="8"  y2="-2" stroke-width="1.5"/>
    <line x1="5"  y1="2"  x2="8"  y2="2"  stroke-width="1.5"/>
  </g>

  <!-- Main flow arrows -->
  <!-- Explain/Research → Break down tasks -->
  <path class="arrow" d="M 200 85 L 305 85"/>
  <!-- Break down tasks → Plan -->
  <path class="arrow" d="M 485 85 L 590 85"/>
  <!-- Plan → Execute (straight down, col 3) -->
  <path class="arrow" d="M 680 120 L 680 190"/>
  <!-- Execute → Review (straight left, row 2) -->
  <path class="arrow" d="M 590 225 L 485 225"/>
  <!-- Review → Test (straight left, row 2) -->
  <path class="arrow" d="M 305 225 L 200 225"/>

  <!-- Feedback loops (dashed) -->
  <!-- Test → Explain/Research (straight up, col 1) -->
  <path class="back-arrow" d="M 80 190 L 80 120"/>
  <!-- Review → Plan (diagonal up-right) -->
  <path class="back-arrow" d="M 450 190 Q 530 140 640 120"/>
</svg>
