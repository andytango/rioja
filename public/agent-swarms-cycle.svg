<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-label="Review, swarm, repeat cycle diagram">
  <title>Review, swarm, repeat: Audit, Annotate, Swarm Fix cycle</title>
  <defs>
    <style>
      text { font-family: 'Berkeley Mono', monospace; fill: currentColor; }
      .box-text  { font-size: 14px; font-weight: 500; }
      .box-sub   { font-size: 11px; font-style: italic; }
      .human-box { stroke: rgb(217, 119, 6);  fill: rgba(217, 119, 6,  0.08); }
      .ai-box    { stroke: rgb(59, 130, 246); fill: rgba(59, 130, 246, 0.08); }
      .arrow     { fill: none; stroke: currentColor; stroke-width: 2; marker-end: url(#arrowhead); }
      .back-arrow{ fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 5,3; marker-end: url(#arrowhead); opacity: 0.7; }
      .human-icon{ stroke: rgb(217, 119, 6); fill: none; }
      .ai-icon   { stroke: rgb(59, 130, 246); fill: none; }
      .label     { font-size: 10px; opacity: 0.5; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Row 1, Col 1: Generate (AI) -->
  <rect class="ai-box" x="100" y="50" width="180" height="70" rx="6"/>
  <text x="190" y="82" text-anchor="middle" class="box-text">Generate</text>
  <text x="190" y="101" text-anchor="middle" class="box-sub">Agent writes code</text>
  <g class="ai-icon" transform="translate(266, 62)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke-width="1.5"/>
    <line x1="-5" y1="-2" x2="-8" y2="-2" stroke-width="1.5"/>
    <line x1="-5" y1="2"  x2="-8" y2="2"  stroke-width="1.5"/>
    <line x1="5"  y1="-2" x2="8"  y2="-2" stroke-width="1.5"/>
    <line x1="5"  y1="2"  x2="8"  y2="2"  stroke-width="1.5"/>
  </g>

  <!-- Row 1, Col 2: Audit (AI, fresh session) -->
  <rect class="ai-box" x="470" y="50" width="180" height="70" rx="6"/>
  <text x="560" y="82" text-anchor="middle" class="box-text">Audit</text>
  <text x="560" y="101" text-anchor="middle" class="box-sub">Fresh session reviews</text>
  <g class="ai-icon" transform="translate(636, 62)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke-width="1.5"/>
    <line x1="-5" y1="-2" x2="-8" y2="-2" stroke-width="1.5"/>
    <line x1="-5" y1="2"  x2="-8" y2="2"  stroke-width="1.5"/>
    <line x1="5"  y1="-2" x2="8"  y2="-2" stroke-width="1.5"/>
    <line x1="5"  y1="2"  x2="8"  y2="2"  stroke-width="1.5"/>
  </g>

  <!-- Row 2, Col 1: Swarm Fix (AI) -->
  <rect class="ai-box" x="100" y="190" width="180" height="70" rx="6"/>
  <text x="190" y="218" text-anchor="middle" class="box-text">Swarm Fix</text>
  <text x="190" y="237" text-anchor="middle" class="box-sub">Agent team remediates</text>
  <g class="ai-icon" transform="translate(266, 202)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke-width="1.5"/>
    <line x1="-5" y1="-2" x2="-8" y2="-2" stroke-width="1.5"/>
    <line x1="-5" y1="2"  x2="-8" y2="2"  stroke-width="1.5"/>
    <line x1="5"  y1="-2" x2="8"  y2="-2" stroke-width="1.5"/>
    <line x1="5"  y1="2"  x2="8"  y2="2"  stroke-width="1.5"/>
  </g>

  <!-- Row 2, Col 2: Annotate (Human) -->
  <rect class="human-box" x="470" y="190" width="180" height="70" rx="6"/>
  <text x="560" y="218" text-anchor="middle" class="box-text">Annotate</text>
  <text x="560" y="237" text-anchor="middle" class="box-sub">Triage findings</text>
  <g class="human-icon" transform="translate(636, 202)">
    <circle cx="0" cy="-5" r="3.5" stroke-width="1.5"/>
    <path d="M -6 5 Q 0 0 6 5" fill="none" stroke-width="1.5"/>
  </g>

  <!-- Main flow arrows -->
  <!-- Generate → Audit (right, row 1) -->
  <path class="arrow" d="M 280 85 L 470 85"/>

  <!-- Audit → Annotate (down, col 2) -->
  <path class="arrow" d="M 560 120 L 560 190"/>

  <!-- Annotate → Swarm Fix (left, row 2) -->
  <path class="arrow" d="M 470 225 L 280 225"/>
  <text x="375" y="218" text-anchor="middle" class="label">blocking issues</text>

  <!-- Feedback loop: Swarm Fix → Audit (dashed, up col 1 then across) -->
  <path class="back-arrow" d="M 160 190 L 160 120"/>
  <text x="148" y="155" text-anchor="end" class="label">repeat</text>
</svg>
