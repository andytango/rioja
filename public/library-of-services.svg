<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Library of Services architecture diagram">
  <title>Library of Services Pattern</title>
  <defs>
    <style>
      text { font-family: 'Berkeley Mono', monospace; font-size: 14px; fill: currentColor; }
      .label { font-size: 12px; }
      .directory { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 5,5; }
      .file { fill: none; stroke: currentColor; stroke-width: 2; rx: 3; }
      .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; }
      .service { fill: rgba(59, 130, 246, 0.1); }
      .entry { fill: rgba(168, 85, 247, 0.1); }
    </style>
  </defs>

  <!-- Entry points on left -->
  <text x="160" y="70" text-anchor="middle" class="label">entry points</text>

  <rect class="file entry" x="70" y="90" width="180" height="60"/>
  <text x="160" y="125" text-anchor="middle">api/users</text>

  <rect class="file entry" x="70" y="180" width="180" height="60"/>
  <text x="160" y="215" text-anchor="middle">api/posts</text>

  <rect class="file entry" x="70" y="270" width="180" height="60"/>
  <text x="160" y="305" text-anchor="middle">cli</text>

  <rect class="file entry" x="70" y="360" width="180" height="60"/>
  <text x="160" y="395" text-anchor="middle">worker</text>

  <!-- lib directory on right -->
  <rect class="directory" x="530" y="80" width="220" height="340"/>
  <text x="740" y="70" text-anchor="end" class="label">lib/</text>

  <!-- Services in lib -->
  <rect class="file service" x="550" y="100" width="180" height="60"/>
  <text x="640" y="135" text-anchor="middle">auth</text>

  <rect class="file service" x="550" y="180" width="180" height="60"/>
  <text x="640" y="215" text-anchor="middle">database</text>

  <rect class="file service" x="550" y="260" width="180" height="60"/>
  <text x="640" y="295" text-anchor="middle">validation</text>

  <rect class="file service" x="550" y="340" width="180" height="60"/>
  <text x="640" y="375" text-anchor="middle">logger</text>

  <!-- Import arrows (no arrowheads) -->
  <!-- api/users imports auth, database, validation -->
  <path class="arrow" d="M 250 120 L 550 130"/>
  <path class="arrow" d="M 250 120 Q 400 120 550 210"/>
  <path class="arrow" d="M 250 120 Q 400 120 550 290"/>

  <!-- api/posts imports database, validation, logger -->
  <path class="arrow" d="M 250 210 Q 400 210 550 210"/>
  <path class="arrow" d="M 250 210 Q 400 210 550 290"/>
  <path class="arrow" d="M 250 210 Q 400 260 550 370"/>

  <!-- cli imports auth, logger -->
  <path class="arrow" d="M 250 300 Q 400 260 550 130"/>
  <path class="arrow" d="M 250 300 Q 400 330 550 370"/>

  <!-- worker imports database, logger -->
  <path class="arrow" d="M 250 390 Q 400 340 550 210"/>
  <path class="arrow" d="M 250 390 L 550 370"/>

  <!-- Labels -->
  <text x="400" y="470" text-anchor="middle" style="font-size: 16px; font-weight: bold;">
    Entry points import from shared service library
  </text>
</svg>
