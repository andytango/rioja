<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-labelledby="mo-title mo-desc">
  <title id="mo-title">Middle-Out approach</title>
  <desc id="mo-desc">The same pipeline with the enrichment and transformation stages highlighted and both the data source and output screens faded, showing the middle-out build strategy</desc>
  <defs>
    <style>
      text { font-family: 'Berkeley Mono', monospace; fill: currentColor; }
      .label { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .sm-label { font-size: 13px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .active { fill: rgba(217, 119, 6, 0.1); stroke: currentColor; stroke-width: 2.5; rx: 6; }
      .faded { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 6; }
      .arrow { fill: none; stroke: currentColor; stroke-width: 2; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0.5, 9 4, 0 7.5" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Faded input stage -->
  <g opacity="0.35">
    <rect class="faded" x="15" y="101" width="140" height="52"/>
    <text class="label" x="85" y="127">Data Source</text>

    <path class="arrow" d="M 155 127 L 193 127"/>

    <rect class="faded" x="195" y="101" width="120" height="52"/>
    <text class="label" x="255" y="127">Ingestion</text>
  </g>

  <!-- Bridging arrow into active zone -->
  <g opacity="0.55">
    <path class="arrow" d="M 315 127 L 353 127"/>
  </g>

  <!-- Active middle stages -->
  <rect class="active" x="355" y="101" width="120" height="52"/>
  <text class="label" x="415" y="127">Enrichment</text>

  <path class="arrow" d="M 475 127 L 513 127"/>

  <rect class="active" x="515" y="101" width="130" height="52"/>
  <text class="label" x="580" y="127">Transform</text>

  <!-- Bridging fan-out arrows -->
  <g opacity="0.55">
    <path class="arrow" d="M 645 127 L 718 37"/>
    <path class="arrow" d="M 645 127 L 718 97"/>
    <path class="arrow" d="M 645 127 L 718 157"/>
    <path class="arrow" d="M 645 127 L 718 217"/>
  </g>

  <!-- Faded output boxes -->
  <g opacity="0.35">
    <rect class="faded" x="720" y="15" width="130" height="44"/>
    <text class="sm-label" x="785" y="37">Alerts</text>

    <rect class="faded" x="720" y="75" width="130" height="44"/>
    <text class="sm-label" x="785" y="97">Feeds</text>

    <rect class="faded" x="720" y="135" width="130" height="44"/>
    <text class="sm-label" x="785" y="157">Dashboards</text>

    <rect class="faded" x="720" y="195" width="130" height="44"/>
    <text class="sm-label" x="785" y="217">Reports</text>
  </g>
</svg>
