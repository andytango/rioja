<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="books-title books-desc">
  <title id="books-title">Chinese and Western printed books</title>
  <desc id="books-desc">Stacks of traditional Chinese thread-bound books alongside Western bound volumes</desc>
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#1a1008" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow-sm">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1a1008" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- === Chinese thread-bound books (left side) === -->

  <!-- Bottom book - flat -->
  <g filter="url(#shadow-sm)">
    <g transform="translate(140, 295) rotate(-1)">
      <rect x="0" y="0" width="200" height="32" rx="1" fill="#e8dcc0" stroke="#b8a880" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="4" y="3" width="192" height="26" rx="0" fill="#f4edd8" stroke="#d8c8a0" stroke-width="0.5"/>
      <line x1="188" y1="6" x2="188" y2="26" stroke="#c87830" stroke-width="1.5"/>
      <circle cx="188" cy="8" r="2" fill="#c87830"/>
      <circle cx="188" cy="16" r="2" fill="#c87830"/>
      <circle cx="188" cy="24" r="2" fill="#c87830"/>
    </g>
  </g>

  <!-- Second book - flat -->
  <g filter="url(#shadow-sm)">
    <g transform="translate(150, 266) rotate(0.5)">
      <rect x="0" y="0" width="185" height="28" rx="1" fill="#d4c8a8" stroke="#b0a078" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="4" y="3" width="177" height="22" rx="0" fill="#efe6d0" stroke="#d0c098" stroke-width="0.5"/>
      <line x1="174" y1="5" x2="174" y2="23" stroke="#c87830" stroke-width="1.5"/>
      <circle cx="174" cy="7" r="1.8" fill="#c87830"/>
      <circle cx="174" cy="14" r="1.8" fill="#c87830"/>
      <circle cx="174" cy="21" r="1.8" fill="#c87830"/>
    </g>
  </g>

  <!-- Third book - flat -->
  <g filter="url(#shadow-sm)">
    <g transform="translate(145, 240) rotate(-0.3)">
      <rect x="0" y="0" width="192" height="26" rx="1" fill="#e0d4b8" stroke="#b8a880" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="4" y="3" width="184" height="20" rx="0" fill="#f2ecd8" stroke="#d4c4a0" stroke-width="0.5"/>
      <line x1="181" y1="5" x2="181" y2="21" stroke="#c87830" stroke-width="1.5"/>
      <circle cx="181" cy="7" r="1.8" fill="#c87830"/>
      <circle cx="181" cy="14" r="1.8" fill="#c87830"/>
      <circle cx="181" cy="21" r="1.8" fill="#c87830"/>
    </g>
  </g>

  <!-- Standing Chinese book -->
  <g filter="url(#shadow)">
    <g transform="translate(175, 55) rotate(2)">
      <rect x="0" y="0" width="130" height="185" rx="1" fill="#e0d4b8" stroke="#a89870" stroke-width="2" filter="url(#paper)"/>
      <rect x="10" y="10" width="110" height="165" fill="none" stroke="#c8b890" stroke-width="0.8"/>
      <rect x="14" y="14" width="102" height="157" fill="none" stroke="#d0c098" stroke-width="0.5"/>
      <rect x="44" y="25" width="42" height="105" rx="1" fill="#f4edd8" stroke="#b8a878" stroke-width="1"/>
      <text x="65" y="55" font-family="Berkeley Mono, serif" font-size="22" fill="#3a3028" text-anchor="middle" font-weight="700">科</text>
      <text x="65" y="84" font-family="Berkeley Mono, serif" font-size="22" fill="#3a3028" text-anchor="middle" font-weight="700">學</text>
      <text x="65" y="113" font-family="Berkeley Mono, serif" font-size="22" fill="#3a3028" text-anchor="middle" font-weight="700">革</text>
      <text x="65" y="148" font-family="Berkeley Mono, serif" font-size="11" fill="#6a5a40" text-anchor="middle">命</text>
      <line x1="122" y1="20" x2="122" y2="55" stroke="#c87830" stroke-width="2"/>
      <line x1="122" y1="130" x2="122" y2="165" stroke="#c87830" stroke-width="2"/>
      <circle cx="122" cy="25" r="2.5" fill="#c87830"/>
      <circle cx="122" cy="50" r="2.5" fill="#c87830"/>
      <circle cx="122" cy="135" r="2.5" fill="#c87830"/>
      <circle cx="122" cy="160" r="2.5" fill="#c87830"/>
      <rect x="-6" y="3" width="6" height="179" fill="#f0e8d0" stroke="#c8b890" stroke-width="0.5" rx="0"/>
      <line x1="-5" y1="20" x2="-1" y2="20" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="-5" y1="40" x2="-1" y2="40" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="-5" y1="60" x2="-1" y2="60" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="-5" y1="80" x2="-1" y2="80" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="-5" y1="100" x2="-1" y2="100" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="-5" y1="120" x2="-1" y2="120" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="-5" y1="140" x2="-1" y2="140" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="-5" y1="160" x2="-1" y2="160" stroke="#d8c8a8" stroke-width="0.3"/>
    </g>
  </g>

  <!-- === Western bound volumes (right side) === -->

  <!-- Bottom book -->
  <g filter="url(#shadow-sm)">
    <g transform="translate(480, 290) rotate(1)">
      <rect x="0" y="0" width="220" height="38" rx="2" fill="#4a3828" stroke="#3a2818" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="0" y="0" width="18" height="38" rx="2" fill="#3a2818" stroke="#2a1808" stroke-width="1"/>
      <line x1="3" y1="6" x2="15" y2="6" stroke="#c8a050" stroke-width="1" opacity="0.6"/>
      <line x1="3" y1="32" x2="15" y2="32" stroke="#c8a050" stroke-width="1" opacity="0.6"/>
      <rect x="18" y="3" width="198" height="32" fill="#f4edd8" stroke="#d8c8a0" stroke-width="0.5" rx="1"/>
    </g>
  </g>

  <!-- Second book -->
  <g filter="url(#shadow-sm)">
    <g transform="translate(490, 258) rotate(-0.5)">
      <rect x="0" y="0" width="205" height="32" rx="2" fill="#6a4030" stroke="#5a3020" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="0" y="0" width="16" height="32" rx="2" fill="#5a3020" stroke="#4a2010" stroke-width="1"/>
      <line x1="3" y1="5" x2="13" y2="5" stroke="#c8a050" stroke-width="0.8" opacity="0.5"/>
      <line x1="3" y1="27" x2="13" y2="27" stroke="#c8a050" stroke-width="0.8" opacity="0.5"/>
      <rect x="16" y="3" width="185" height="26" fill="#f2ebd4" stroke="#d4c498" stroke-width="0.5" rx="1"/>
    </g>
  </g>

  <!-- Third book -->
  <g filter="url(#shadow-sm)">
    <g transform="translate(495, 230) rotate(0.3)">
      <rect x="0" y="0" width="195" height="28" rx="2" fill="#3a4a38" stroke="#2a3a28" stroke-width="1.5" filter="url(#paper)"/>
      <rect x="0" y="0" width="14" height="28" rx="2" fill="#2a3a28" stroke="#1a2a18" stroke-width="1"/>
      <line x1="2" y1="5" x2="12" y2="5" stroke="#c8a050" stroke-width="0.8" opacity="0.4"/>
      <line x1="2" y1="23" x2="12" y2="23" stroke="#c8a050" stroke-width="0.8" opacity="0.4"/>
      <rect x="14" y="3" width="177" height="22" fill="#f0e8d0" stroke="#d0c098" stroke-width="0.5" rx="1"/>
    </g>
  </g>

  <!-- Standing Western book - Principia -->
  <g filter="url(#shadow)">
    <g transform="translate(540, 50) rotate(-3)">
      <rect x="0" y="0" width="140" height="190" rx="3" fill="#4a3828" stroke="#3a2818" stroke-width="2" filter="url(#paper)"/>
      <rect x="0" y="0" width="20" height="190" rx="3" fill="#3a2818" stroke="#2a1808" stroke-width="1.5" filter="url(#paper)"/>
      <line x1="3" y1="15" x2="17" y2="15" stroke="#c8a050" stroke-width="1.5" opacity="0.6"/>
      <line x1="3" y1="45" x2="17" y2="45" stroke="#c8a050" stroke-width="1.5" opacity="0.6"/>
      <line x1="3" y1="145" x2="17" y2="145" stroke="#c8a050" stroke-width="1.5" opacity="0.6"/>
      <line x1="3" y1="175" x2="17" y2="175" stroke="#c8a050" stroke-width="1.5" opacity="0.6"/>
      <text x="11" y="95" font-family="Berkeley Mono, monospace" font-size="8" fill="#c8a050" text-anchor="middle" transform="rotate(-90 11 95)" letter-spacing="2" opacity="0.8">PRINCIPIA</text>
      <rect x="30" y="15" width="100" height="160" fill="none" stroke="#c8a050" stroke-width="0.8" opacity="0.3" rx="1"/>
      <rect x="34" y="19" width="92" height="152" fill="none" stroke="#c8a050" stroke-width="0.5" opacity="0.2" rx="1"/>
      <text x="80" y="65" font-family="Berkeley Mono, monospace" font-size="11" fill="#c8a050" text-anchor="middle" font-weight="600" letter-spacing="1" opacity="0.8">PRINCIPIA</text>
      <text x="80" y="82" font-family="Berkeley Mono, monospace" font-size="9" fill="#c8a050" text-anchor="middle" letter-spacing="1" opacity="0.6">MATHEMATICA</text>
      <line x1="50" y1="95" x2="110" y2="95" stroke="#c8a050" stroke-width="0.8" opacity="0.4"/>
      <text x="80" y="120" font-family="Berkeley Mono, monospace" font-size="9" fill="#c8a050" text-anchor="middle" opacity="0.5">NEWTON</text>
      <rect x="140" y="4" width="8" height="182" fill="#f0e8d0" stroke="#c8b890" stroke-width="0.5" rx="1"/>
      <line x1="141" y1="20" x2="147" y2="20" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="141" y1="40" x2="147" y2="40" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="141" y1="60" x2="147" y2="60" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="141" y1="80" x2="147" y2="80" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="141" y1="100" x2="147" y2="100" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="141" y1="120" x2="147" y2="120" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="141" y1="140" x2="147" y2="140" stroke="#d8c8a8" stroke-width="0.3"/>
      <line x1="141" y1="160" x2="147" y2="160" stroke="#d8c8a8" stroke-width="0.3"/>
    </g>
  </g>
</svg>
