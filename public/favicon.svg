<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Retro CRT Monitor Bezel -->
    <rect x="8" y="8" width="112" height="112" rx="8" fill="#e8dcc8"/>

    <!-- Screen Bezel Shadow -->
    <rect x="14" y="14" width="100" height="100" rx="4" fill="#3a3028"/>

    <!-- CRT Screen -->
    <rect x="18" y="18" width="92" height="92" rx="2" fill="#1a1410"/>

    <!-- Scanline effect -->
    <defs>
        <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
            <rect x="0" y="0" width="4" height="2" fill="#000000" opacity="0.3"/>
        </pattern>
    </defs>
    <rect x="18" y="18" width="92" height="92" rx="2" fill="url(#scanlines)"/>

    <!-- Terminal Text: >_ -->
    <text x="34" y="78" font-family="monospace" font-size="48" font-weight="bold" fill="#d97706" opacity="0.95">
        &gt;_
    </text>

    <!-- Subtle glow effect -->
    <defs>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <text x="34" y="78" font-family="monospace" font-size="48" font-weight="bold" fill="#fbbf24" filter="url(#glow)" opacity="0.6">
        &gt;_
    </text>
</svg>
