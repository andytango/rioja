<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 624" role="img" aria-labelledby="ccp-title ccp-desc">
  <title id="ccp-title">The components of Agent Control Plane</title>
  <desc id="ccp-desc">Five components across three zones, stacked. In the agent zone, an agent harness running Claude or Gemini. In the server zone, the backend, written in Rust with SQLite. In the browser zone, a sync worker, IndexedDB, and the UI.</desc>
  <defs>
    <style>
      text { font-family: 'Berkeley Mono', monospace; fill: currentColor; }
      .zone { font-size: 12px; font-weight: 600; text-anchor: start; opacity: 0.7; }
      .box-text { font-size: 15px; font-weight: 500; text-anchor: middle; }
      .box-sub  { font-size: 11.5px; font-style: italic; text-anchor: middle; opacity: 0.72; }
      .box-agent   { stroke: rgb(217,119,6);  fill: rgba(217,119,6,0.08);  stroke-width: 2; }
      .box-server  { stroke: rgb(34,197,94);  fill: rgba(34,197,94,0.08);  stroke-width: 2; }
      .box-browser { stroke: rgb(59,130,246); fill: rgba(59,130,246,0.08); stroke-width: 2; }
      .link { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.45; }
    </style>
  </defs>

  <!-- Agent -->
  <text class="zone" x="90" y="40">Agent</text>
  <rect class="box-agent" x="90" y="50" width="200" height="64" rx="6"/>
  <text class="box-text" x="190" y="83">Agent harness</text>
  <text class="box-sub"  x="190" y="101">Claude / Gemini</text>

  <line class="link" x1="190" y1="114" x2="190" y2="156"/>

  <!-- Server -->
  <text class="zone" x="90" y="182">Server</text>
  <rect class="box-server" x="90" y="192" width="200" height="64" rx="6"/>
  <text class="box-text" x="190" y="225">Backend</text>
  <text class="box-sub"  x="190" y="243">Rust + SQLite</text>

  <line class="link" x1="190" y1="256" x2="190" y2="298"/>

  <!-- Browser -->
  <text class="zone" x="90" y="324">Browser</text>
  <rect class="box-browser" x="90" y="334" width="200" height="64" rx="6"/>
  <text class="box-text" x="190" y="367">Sync worker</text>
  <text class="box-sub"  x="190" y="385">syncs IDB &#8646; server</text>

  <line class="link" x1="190" y1="398" x2="190" y2="430"/>

  <rect class="box-browser" x="90" y="430" width="200" height="64" rx="6"/>
  <text class="box-text" x="190" y="463">IndexedDB</text>
  <text class="box-sub"  x="190" y="481">events + outbox</text>

  <line class="link" x1="190" y1="494" x2="190" y2="526"/>

  <rect class="box-browser" x="90" y="526" width="200" height="64" rx="6"/>
  <text class="box-text" x="190" y="559">UI</text>
  <text class="box-sub"  x="190" y="577">render the view</text>
</svg>
